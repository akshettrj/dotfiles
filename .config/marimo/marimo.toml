[keymap]
preset = "vim"
vimrc = "/Users/akshettrai.jindal/.config/marimo/vimrc"
destructive_delete = true

[keymap.overrides]
"cell.viewAsMarkdown" = "Alt-Shift-̨"

[display]
code_editor_font_size = 17
default_table_page_size = 10
default_table_max_columns = 50
reference_highlighting = true
cell_output = "above"
dataframes = "rich"
default_width = "full"
theme = "system"

[package_management]
manager = "uv"

[snippets]
include_default_snippets = true
custom_paths = []

[language_servers.basedpyright]
enabled = false

[language_servers.ty]
enabled = true

[language_servers.pylsp]
enabled = true
enable_pyflakes = false
enable_pydocstyle = false
enable_ruff = true
enable_mypy = true
enable_flake8 = false
enable_pylint = false

[datasources]

[runtime]
default_sql_output = "auto"
default_auto_download = ["html"]
std_stream_max_bytes = 1000000
watcher_on_save = "lazy"
auto_instantiate = false
output_max_bytes = 8000000
reactive_tests = true
on_cell_change = "lazy"
auto_reload = "lazy"

[completion]
activate_on_typing = true
copilot = false

[save]
autosave_delay = 15000
autosave = "after_delay"
format_on_save = true

[server]
browser = "default"
follow_symlink = false

[diagnostics]
enabled = true
sql_linter = true

[ai]
rules = "Always use type hints for variables whenever possible"
mode = "manual"
inline_tooltip = false

[ai.models]
displayed_models = []
autocomplete_model = "ollama/gpt-oss:20b"
edit_model = "ollama/gpt-oss:20b"
custom_models = []
chat_model = "ollama/gpt-oss:20b"

[mcp]
presets = []

[mcp.mcpServers]

[formatting]
line_length = 80

[experimental]
rtc_v2 = false
inline_ai_tooltip = false
sql_linter = true
chat_modes = true
performant_table_charts = true
